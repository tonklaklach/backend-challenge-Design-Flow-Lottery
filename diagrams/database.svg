<text x="376" y="168" font-family="monospace" font-size="12" fill="#49647c">varchar(6)</text>
<text x="515" y="168" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#1f5376"></text>
<text x="54" y="195" font-family="monospace" font-size="13" fill="#203b4e">d1</text>
<text x="376" y="195" font-family="monospace" font-size="12" fill="#49647c">smallint generated</text>
<text x="515" y="195" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#1f5376"></text>
<text x="54" y="222" font-family="monospace" font-size="13" fill="#203b4e">d2</text>
<text x="376" y="222" font-family="monospace" font-size="12" fill="#49647c">smallint generated</text>
<text x="515" y="222" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#1f5376"></text>
<text x="54" y="249" font-family="monospace" font-size="13" fill="#203b4e">d3</text>
<text x="376" y="249" font-family="monospace" font-size="12" fill="#49647c">smallint generated</text>
<text x="515" y="249" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#1f5376"></text>
<text x="54" y="276" font-family="monospace" font-size="13" fill="#203b4e">d4</text>
<text x="376" y="276" font-family="monospace" font-size="12" fill="#49647c">smallint generated</text>
<text x="515" y="276" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#1f5376"></text>
<text x="54" y="303" font-family="monospace" font-size="13" fill="#203b4e">d5</text>
<text x="376" y="303" font-family="monospace" font-size="12" fill="#49647c">smallint generated</text>
<text x="515" y="303" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#1f5376"></text>
<text x="54" y="330" font-family="monospace" font-size="13" fill="#203b4e">d6</text>
<text x="376" y="330" font-family="monospace" font-size="12" fill="#49647c">smallint generated</text>
<text x="515" y="330" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#1f5376"></text>
<text x="54" y="357" font-family="monospace" font-size="13" fill="#203b4e">status</text>
<text x="376" y="357" font-family="monospace" font-size="12" fill="#49647c">varchar(16)</text>
<text x="515" y="357" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#1f5376"></text>
<text x="54" y="384" font-family="monospace" font-size="13" fill="#203b4e">current_reservation_id</text>
<text x="376" y="384" font-family="monospace" font-size="12" fill="#49647c">uuid NULL</text>
<text x="515" y="384" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#1f5376">FK</text>
<rect x="640" y="80" width="520" height="320" rx="8" fill="white" stroke="#49647c" stroke-width="1.5"/>
<path d="M648 80 H1152 Q1160 80 1160 88 V120 H640 V88 Q640 80 648 80" fill="#1f5376"/>
<text x="656" y="107" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="white">reservations</text>
