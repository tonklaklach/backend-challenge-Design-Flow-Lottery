<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">Lottery allocation relational database diagram</title>
<desc id="desc">Tickets have an optional current reservation. Reservation items retain the many-to-many allocation history.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#49647c"/></marker></defs>
<rect width="1200" height="800" fill="#f7f9fc"/>
<text x="40" y="36" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#18344a">Lottery allocation — relational model</text>
<rect x="40" y="80" width="520" height="320" rx="8" fill="white" stroke="#49647c" stroke-width="1.5"/>
<path d="M48 80 H552 Q560 80 560 88 V120 H40 V88 Q40 80 48 80" fill="#1f5376"/>
<text x="56" y="107" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="white">tickets</text>
